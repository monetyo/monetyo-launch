subject: Confirma la plaça a la llista d’espera de Monetyo
preheader: Un clic i ja ets a la llista.
heading: Només un pas més
body: Gràcies per apuntar-te a la llista d’espera de Monetyo. Confirma que aquesta adreça és teva i et mantindrem al corrent del llançament, amb alguna enquesta breu de tant en tant.
button: Confirma el correu
fallback: "El botó no funciona? Enganxa aquest enllaç al navegador:"
ignore: No t’hi has apuntat? Ignora aquest correu i la teva adreça s’esborrarà en 7 dies.
unsubscribe: Dona’m de baixa
