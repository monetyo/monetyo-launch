heading: Ancora un passo
body: Grazie per l’iscrizione alla lista d’attesa di Monetyo. Conferma che questo indirizzo è tuo e ti daremo notizie sul lancio, con qualche breve sondaggio ogni tanto.
button: Conferma l’email
fallback: "Il pulsante non funziona? Incolla questo link nel browser:"
ignore: Iscrizione non tua? Ignora questa email e il tuo indirizzo sarà cancellato entro 7 giorni.
unsubscribe: Disiscriviti
