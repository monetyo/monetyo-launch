subject: Conferma la tua iscrizione alla lista d’attesa di Monetyo
preheader: Basta un clic per confermare l’iscrizione.
heading: Manca solo un passaggio
body: "Grazie per l’iscrizione alla lista d’attesa di Monetyo. Conferma che questo indirizzo è tuo: ti avviseremo quando Monetyo sarà pronto e, ogni tanto, ti manderemo un breve sondaggio."
button: Conferma la mia email
fallback: "Il pulsante non funziona? Copia questo link nel browser:"
ignore: "Non hai richiesto tu l’iscrizione? Ignora questa email: il tuo indirizzo verrà cancellato entro 7 giorni."
unsubscribe: Annulla l’iscrizione
