subject: Has sortit de la llista d’espera de Monetyo
preheader: La teva adreça de correu s’ha esborrat de la llista.
heading: Ja no ets a la llista
body: Hem esborrat la teva adreça de la llista d’espera de Monetyo, amb la resta de dades de la teva inscripció. És l’últim correu que t’enviem.
records: Durant 3 anys guardem un registre de cada cop que et vas apuntar, vas confirmar o et vas donar de baixa, per poder demostrar què vas acceptar. És el termini que té una autoritat de protecció de dades per actuar davant d’una reclamació. Els registres no inclouen la teva adreça de correu. Contenen el text que vas veure, l’agent d’usuari del navegador i un codi generat a partir de la teva IP que no permet recuperar-la.
rejoin: Has canviat d’idea? Pots tornar a apuntar-te quan vulguis a monetyo.com.
