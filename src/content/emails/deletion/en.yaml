subject: You've left the Monetyo waitlist
preheader: Your email address has been deleted from the list.
heading: You're off the list
body: We've deleted your email address from the Monetyo waitlist, along with the rest of your signup. This is the last email you'll get from us.
records: For 3 years, the time a data protection authority has to act on a complaint, we keep a record of each time you signed up, confirmed or unsubscribed, so we can show what you agreed to. Those records don't include your email address. They hold the wording you were shown, your browser's user agent and a code made from your IP address that can't be turned back into it.
rejoin: Changed your mind? You're welcome to join again at any time on monetyo.com.
