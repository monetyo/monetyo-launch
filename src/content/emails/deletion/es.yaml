subject: Has salido de la lista de espera de Monetyo
preheader: Tu dirección de correo se ha borrado de la lista.
heading: Ya no estás en la lista
body: Hemos borrado tu dirección de correo de la lista de espera de Monetyo, con el resto de los datos de tu alta. Es el último correo que te enviamos.
records: Durante 3 años guardamos un registro de cada vez que te apuntaste, confirmaste o te diste de baja, para poder demostrar qué aceptaste. Es el plazo que tiene una autoridad de protección de datos para actuar ante una queja. Esos registros no incluyen tu dirección de correo. Contienen el texto que viste, el agente de usuario de tu navegador y un código generado a partir de tu IP que no permite recuperarla.
rejoin: ¿Has cambiado de idea? Puedes volver a apuntarte cuando quieras en monetyo.com.
