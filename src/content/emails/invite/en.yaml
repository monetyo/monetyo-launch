subject: Monetyo is ready for you to try
preheader: You're among the first households to get in.
heading: Your invitation to Monetyo
body: |
  You joined the waitlist to hear when Monetyo was ready. It's ready for its first households, and we'd like yours to be one of them.

  Set up your household, add what you spend and invite the people you share money with. It's early days, so a few things will still be rough around the edges.
button: Try Monetyo
fallback: "Button not working? Paste this link into your browser:"
feedback: Something confusing, missing or broken? Reply to this email and tell us. We read every message, and what you say decides what we fix first.
reason: You're getting this because you joined the Monetyo waitlist.
