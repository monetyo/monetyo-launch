subject: "Monetyo ya está listo: pruébalo"
preheader: Tu hogar es de los primeros en poder entrar.
heading: Tu invitación a Monetyo
body: |
  Te apuntaste a la lista de espera para saber cuándo estaría listo Monetyo. Ya puede recibir a sus primeros hogares, y nos gustaría que el tuyo fuera uno de ellos.

  Crea tu hogar, añade tus gastos e invita a las personas con las que compartes el dinero. Estamos empezando, así que aún habrá cosas por pulir.
button: Probar Monetyo
fallback: "¿No funciona el botón? Pega este enlace en tu navegador:"
feedback: ¿Algo confuso, que falte o que no funcione? Responde a este correo y cuéntanoslo. Leemos todos los mensajes, y lo que nos digas decide qué arreglamos primero.
reason: Te escribimos porque te apuntaste a la lista de espera de Monetyo.
unsubscribe: Darme de baja
