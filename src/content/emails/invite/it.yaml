subject: Monetyo è pronto e puoi provarlo
preheader: La tua famiglia è tra le prime a entrare.
heading: Il tuo invito a Monetyo
body: |
  Hai lasciato la tua email nella lista d’attesa per sapere quando Monetyo sarebbe stato pronto. Ora può accogliere le prime famiglie, e vorremmo che la tua fosse una di queste.

  Configura la tua famiglia, aggiungi le spese e invita le persone con cui condividi i soldi. Siamo agli inizi, quindi qualcosa sarà ancora da sistemare.
button: Prova Monetyo
fallback: "Il pulsante non funziona? Incolla questo link nel browser:"
feedback: Qualcosa non è chiaro, manca o non funziona? Rispondi a questa email e diccelo. Leggiamo ogni messaggio, e quello che ci dici decide cosa sistemiamo prima.
reason: Ti scriviamo per la tua iscrizione alla lista d’attesa di Monetyo.
unsubscribe: Disiscriviti
