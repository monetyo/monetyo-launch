subject: Unes preguntes sobre els diners a casa teva
preheader: Només són uns minuts, i ens ajudes a decidir què construïm primer.
heading: Com us organitzeu els diners a casa?
body: |
  Estem fent Monetyo per a llars de tota mena: parelles, famílies monoparentals, gent que comparteix pis, famílies amb fills i famílies sense. Abans d’anar gaire més lluny, ens agradaria saber com porteu els diners a la vostra.

  L’enquesta et portarà uns minuts. No hi ha respostes bones ni dolentes, i pots saltar-te qualsevol pregunta que prefereixis no respondre.
button: Respon l’enquesta
fallback: "El botó no funciona? Enganxa aquest enllaç al navegador:"
anonymity: Les teves respostes no queden vinculades a la teva adreça de correu, i l’enllaç no ens diu qui ets. Si l’enquesta et pregunta si vols fer una entrevista més llarga, només sabrem que les respostes són teves si hi dius que sí i ens deixes el correu.
reason: T’escrivim perquè et vas apuntar a la llista d’espera de Monetyo.
unsubscribe: Dona’m de baixa
