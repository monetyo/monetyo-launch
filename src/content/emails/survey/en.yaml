subject: A few questions about money in your household
preheader: A few minutes of your time, and it shapes what we build first.
heading: How does money work in your home?
body: |
  We're building Monetyo for households of every shape: couples, single parents, flatmates, families with children and families without. Before we build much more, we'd like to hear how money works in yours.

  The survey takes a few minutes. There are no right answers, and you can skip any question you'd rather not answer.
button: Take the survey
fallback: "Button not working? Paste this link into your browser:"
anonymity: Your answers aren't linked to your email address, and the link doesn't tell us who you are. If the survey asks whether you'd like a longer interview, we'll only know the answers are yours if you say yes and leave your email.
reason: You're getting this because you joined the Monetyo waitlist.
