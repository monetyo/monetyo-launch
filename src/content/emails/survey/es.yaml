subject: Unas preguntas sobre el dinero en tu hogar
preheader: Son unos minutos y nos ayudas a decidir qué construimos primero.
heading: ¿Cómo os organizáis con el dinero?
body: |
  Estamos creando Monetyo para hogares de todo tipo: parejas, familias monoparentales, gente que comparte piso, familias con hijos y sin ellos. Antes de construir mucho más, queremos saber cómo se maneja el dinero en el tuyo.

  La encuesta te llevará unos minutos. No hay respuestas buenas ni malas, y puedes saltarte cualquier pregunta que no quieras contestar.
button: Responder la encuesta
fallback: "¿No funciona el botón? Pega este enlace en tu navegador:"
anonymity: Tus respuestas no se vinculan a tu dirección de correo, y el enlace no nos dice quién eres. Si la encuesta te pregunta si quieres hacer una entrevista más larga, solo sabremos que las respuestas son tuyas si dices que sí y nos dejas tu correo.
reason: Te escribimos porque te apuntaste a la lista de espera de Monetyo.
unsubscribe: Darme de baja
