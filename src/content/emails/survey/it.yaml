subject: Qualche domanda sui soldi nella tua famiglia
preheader: Bastano pochi minuti, e ci aiuti a decidere cosa costruire prima.
heading: Come gestite i soldi in famiglia?
body: |
  Stiamo costruendo Monetyo per famiglie di ogni tipo: coppie, genitori single, coinquilini, famiglie con figli e senza. Prima di andare molto più avanti, vorremmo sapere come vi organizzate con i soldi nella vostra.

  Il sondaggio richiede pochi minuti. Non ci sono risposte giuste o sbagliate, e puoi saltare le domande a cui preferisci non rispondere.
button: Rispondi al sondaggio
fallback: "Il pulsante non funziona? Incolla questo link nel browser:"
anonymity: Le tue risposte non sono collegate al tuo indirizzo email, e il link non ci dice chi sei. Se il sondaggio ti chiede se vuoi fare un’intervista più lunga, sapremo che le risposte sono tue solo se dici di sì e ci lasci la tua email.
reason: Ti scriviamo per la tua iscrizione alla lista d’attesa di Monetyo.
unsubscribe: Disiscriviti
