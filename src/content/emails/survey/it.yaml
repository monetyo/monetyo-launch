subject: Qualche domanda su come gestite i soldi in casa
preheader: Bastano pochi minuti e ci aiuti a decidere cosa sviluppare prima.
heading: Come gestite i soldi in casa?
body: |
  Stiamo costruendo Monetyo per ogni tipo di famiglia: coppie, genitori single, coinquilini, famiglie con o senza figli. Prima di andare avanti, vorremmo sapere come funziona con i soldi a casa tua.

  Il sondaggio richiede pochi minuti. Non ci sono risposte giuste o sbagliate e puoi saltare le domande a cui preferisci non rispondere.
button: Rispondi al sondaggio
fallback: "Il pulsante non funziona? Copia questo link nel browser:"
anonymity: Le risposte non sono collegate al tuo indirizzo email e dal link non possiamo sapere chi sei. Se nel sondaggio ti chiediamo la disponibilità per un’intervista più lunga, sapremo che le risposte sono tue solo se accetti e ci lasci la tua email.
reason: Ricevi questa email perché hai lasciato il tuo indirizzo nella lista d’attesa di Monetyo.
unsubscribe: Annulla l’iscrizione
