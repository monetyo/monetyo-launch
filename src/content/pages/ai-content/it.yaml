title: Uso dell’intelligenza artificiale
description: Come usiamo l’intelligenza artificiale per realizzare il sito di Monetyo e quali decisioni restano a noi.
updated: 2026-11-22
updatedLabel: "Ultimo aggiornamento: {date}"
intro: >-
  Questa pagina riguarda solo il sito monetyo.com: quali strumenti di intelligenza artificiale usiamo per realizzarlo, cosa fanno e cosa facciamo noi. L’uso dell’IA nell’app Monetyo sarà descritto nella documentazione dell’app, al momento del lancio.

sections:
  - heading: Gli strumenti che usiamo
    items:
      - term: Claude e Claude Code
        description: >-
          <a href="https://www.anthropic.com/claude" target="_blank" rel="noopener noreferrer">Claude</a>
          e <a href="https://www.anthropic.com/claude-code" target="_blank" rel="noopener noreferrer">Claude Code</a>,
          di Anthropic, ci aiutano a scrivere e rivedere il codice del sito, a
          preparare e tradurre i testi e a disegnare le illustrazioni, compresi
          i ritratti del team.

  - heading: Come nasce una pagina
    body: >-
      Di solito partiamo da una bozza scritta con Claude sulla base dei nostri
      appunti e del codice. Poi verifichiamo che corrisponda al funzionamento
      reale del prodotto, riscriviamo le parti che non rispecchiano il nostro modo di scrivere e
      correggiamo ogni errore prima di pubblicarla.

  - heading: Cosa decidiamo noi
    body: >-
      Siamo noi a decidere cos’è Monetyo, cosa promette e come tratta i tuoi
      dati, ed è nostra la revisione finale di ogni pagina. Rispondiamo di
      tutto ciò che pubblichiamo, che la prima bozza l’abbia scritta una persona o uno strumento.

  - heading: Cosa prevede la legge
    body: >-
      L’articolo 50, paragrafo 4, del
      <a href="https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/?uri=CELEX:32024R1689" target="_blank" rel="noopener noreferrer">regolamento
      UE sull’IA (Regolamento (UE) 2024/1689)</a> impone di dichiarare i testi
      generati con l’IA e pubblicati per informare il pubblico, a meno che non
      siano stati sottoposti a revisione umana e qualcuno se ne assuma la
      responsabilità editoriale. Tutte le pagine di questo sito rispettano
      queste condizioni, quindi la legge non ci obbliga a questa dichiarazione.
      La pubblichiamo comunque, perché crediamo sia giusto che tu lo sappia.
