    label: "Quatre moviments bancaris endreçats i classificats automàticament: una farmàcia a Salut, un supermercat a Alimentació, un bitllet de tren a Transport i un Bizum que l’usuari ha passat a Restaurants, cosa que Monetyo recordarà."
