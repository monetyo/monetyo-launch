faq:
  heading: Bona pregunta.
  items:
    - question: Quan el podré usar?
      answer: >-
        Anem tan de pressa com podem, però no el traurem fins que l’experiència,
        la privadesa i la seguretat estiguin a punt. Sense dreceres. La gent de
        la llista serà la primera a provar-lo.
    - question: Quant costarà Monetyo?
      answer: >-
        Sospesem diverses opcions: una subscripció per família, un pla gratuït
        amb extres de pagament, una prova gratuïta, o una versió de codi obert
        que pots allotjar tu mateix al costat d’una de pagament al núvol. La gent de
        la llista ens ajudarà a triar.
    - question: Funcionarà amb el meu banc?
      answer: >-
        Sí. Ens connectarem a bancs de tot Europa a través de
        <a href="https://plaid.com/en-eu/" target="_blank" rel="noopener noreferrer">Plaid</a>,
        que té llicència {psd2}, està auditat per {soc2} i certificat en
        {iso27001}. Mentre el teu banc no hi sigui, pots pujar un fitxer de
        qualsevol banc, escanejar tiquets o apuntar els pagaments a mà.
      terms:
        - id: psd2
          label: PSD2
          tip: La llei de la UE que permet a empreses autoritzades llegir les dades del teu banc només amb permís teu i sota control d’un regulador.
        - id: soc2
          label: SOC 2 Tipus 2
          tip: Una auditoria independent que comprova durant mesos que els controls de seguretat funcionen com diuen.
        - id: iso27001
          label: ISO 27001
          tip: La norma internacional per gestionar la seguretat de la informació, revisada cada any per auditors independents.
    - question: Hi pot entrar tota la família?
      answer: >-
        Sí, sigui com sigui la teva família. Tu decideixes qui té el control
        total, qui pot afegir i editar, i qui només en veu algunes parts, tant si
        és la teva parella com algú amb qui comparteixes pis o un assessor
        financer. A més, cadascú pot organitzar els seus widgets, vistes i
        taules.
    - question: Què se’n fa, de les meves dades, amb la IA?
      answer: >-
        L’assistent d’IA veurà el mínim possible. Els noms i els números de
        compte s’eliminen abans que res surti del teu compte, els models petits
        funcionen als nostres propis servidors a Europa i, quan el mòbil ho
        permet, es fa servir IA al mateix dispositiu, com Apple Intelligence. És
        opcional, només pot llegir i classificar les despeses, mai moure diners,
        i les teves dades no s’utilitzen mai per entrenar models.
    - question: Monetyo serà de codi obert?
      answer: >-
        Ens agradaria molt, i ens ho estem plantejant seriosament: fem servir
        codi obert cada dia, i voldria dir que les teves dades sempre són sota
        el teu control. Estem mirant com fer-ho sense que Monetyo deixi de ser
        sostenible, i volem saber què en penses.
    - question: Què m’enviareu per correu?
      answer: >-
        Un missatge quan hi hagi alguna cosa per provar, i una enquesta curta
        quan hàgim de decidir alguna cosa. Les respostes no van lligades al teu
        correu, tret que el deixis per a una entrevista més llarga. Cada correu
        porta un enllaç per donar-te de baixa.

join:
  heading: Entra-hi abans i ajuda’ns a fer Monetyo
  lead: T’escriurem quan hi hagi alguna cosa per provar i, de tant en tant, amb una enquesta curta.
