ai:
  eyebrow: Monetyo IA
  heading: Pregunta pels diners com ho faries a una persona.
  lead: L’assistent treballa amb els teus propis moviments, així que quan preguntes quant us vau gastar menjant fora el mes passat, et dona la xifra real.
  ask:
    heading: Pregunta com ho diries
    body: Sense filtres ni informes per configurar. Escriu la pregunta com la faries a la taula de la cuina i tindràs una xifra amb els pagaments que l’expliquen.
    label: "Una conversa amb l’assistent. Pregunta: què ens ha costat el cotxe aquest any? Resposta: 2.184 euros fins ara, repartits entre benzina, assegurança, una reparació al març, i pàrquing i peatges."
    question: Què ens ha costat el cotxe aquest any?
    answer:
      lead: 2.184 € fins ara.
      rest: La benzina és el que pesa més, i la reparació de març és la que no estava prevista.
    bars:
      - { label: Benzina, value: 962 €, percent: 100 }
      - { label: Assegurança, value: 640 €, percent: 66 }
      - { label: Reparació de març, value: 412 €, percent: 43, highlight: true }
      - { label: Pàrquing i peatges, value: 170 €, percent: 18 }
    suggestions: [Compara amb l’any passat, Mostra els moviments]
