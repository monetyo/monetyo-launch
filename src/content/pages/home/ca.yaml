status:
  heading: En quin punt som
  items:
    - stage: Ara
      title: Recollim les teves idees
      body: Parlem amb famílies, escoltem què ens diuen i mirem què és el que importa més.
    - stage: Tot seguit
      title: L’app web
      body: A l’ordinador o al navegador del mòbil, a mà o amb fitxers del banc.
    - stage: Després
      title: L’assistent amb IA
      body: Classifica les despeses i respon quan vols saber on han anat els diners.
    - stage: Més tard
      title: Apps natives de mòbil
      body: Apps de veritat per a iOS i Android, quan l’app web funcioni molt bé.
  more:
    stage: Més enllà
    title: Molt més per venir
    body: Quan surtin les apps, continuarem fent el que més demanin les famílies. Aquí tens algunes de les idees que ja són a la llista.
    cta: Mira totes les idees

privacy:
  heading: Els diners de casa teva són cosa de casa teva.
  lead: El que gasta una família diu molt d’ella. Vam deixar per escrit com tractaríem les teves dades abans de programar res, i cada part de Monetyo segueix aquestes normes.
  items:
    - icon: globe
      heading: Fet a Europa, guardat a Europa
      body: Creat a Barcelona i allotjat a Frankfurt, còpies de seguretat incloses. Res de la teva família no surt de la UE.
    - icon: lock
      heading: Contrasenyes del banc, mai
      body: El teu banc es connecta amb un proveïdor que té {psd2}, {soc2} i {iso27001}. No veiem mai la teva contrasenya.
      terms:
        - id: psd2
          label: PSD2
          tip: La llei de la UE que permet a empreses autoritzades llegir les dades del teu banc només amb permís teu i sota control d’un regulador.
        - id: iso27001
          label: ISO 27001
          tip: La norma internacional per gestionar la seguretat de la informació, revisada cada any per auditors independents.
        - id: soc2
          label: SOC 2 Tipus 2
          tip: Una auditoria independent que comprova durant mesos que els controls de seguretat funcionen com diuen.
    - icon: key
      heading: Amb una clau només vostra
      body: Els números de compte i les connexions bancàries es xifren amb una clau que només és de la teva família.
    - icon: trash
      heading: Esborrar és esborrar
      body: Tanques el compte i destruïm la clau de la família. Ningú no podrà tornar a llegir les dades, ni a les còpies.
    - icon: download
      heading: Te les pots endur
      body: Descarrega tot el que tenim sobre tu quan vulguis, en un format que pots portar a qualsevol lloc.
    - icon: shield
      heading: IA nativa, no feta a ull
      body: La IA ens ajuda a construir més de pressa. Dècades al sector marquen la direcció, l’arquitectura i cada decisió.

