title: "Monetyo: el pressupost familiar amb IA integrada"
description: Un pressupost per a tota la família, amb un assistent que classifica les despeses, llegeix tiquets i et diu on van els diners. Les dades, a Europa.

hero:
  heading:
    - On han anat els diners?
    - Pregunta-ho a Monetyo.
  lead: Tot el que gasta la teva família en un sol pressupost, i el que queda per a aquest mes. Monetyo posa cada pagament a la categoria que toca i t’avisa a temps quan un pressupost està a punt d’esgotar-se.

