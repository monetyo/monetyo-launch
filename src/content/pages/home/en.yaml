household:
  heading: One budget the whole family can see
  lead: Bring everyone who shares the household’s money into one place, so you’re all looking at the same numbers.
  together:
    heading: The right access for each person
    body: Give someone full control, let others add and edit, or share only the parts a person needs, like the reports with a financial adviser. Everyone can also set up their own widgets, views and tables.
    label: "Household members: Marta has full control, Jonas can add and edit, and Clara, a financial adviser, can only see the reports."
    title: Members
    invite: Invite
    members:
      - {
          initial: M,
          tint: blue,
