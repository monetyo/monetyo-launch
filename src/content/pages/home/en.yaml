ai:
  eyebrow: Monetyo AI
  heading: Ask about your money the way you’d ask a person.
  lead: The assistant works from your own transactions, so when you ask how much went on eating out last month, you get the real figure.
  ask:
    heading: Ask in your own words
    body: No filters or reports to set up. Type the question as you’d say it at the kitchen table, and you get a number with the payments behind it.
    label: "A conversation with the assistant. Question: what did the car cost us this year? Answer: 2,184 euros so far, broken down into fuel, insurance, a repair in March, and parking and tolls."
    question: What did the car cost us this year?
    answer:
      lead: €2,184 so far.
      rest: Fuel is the biggest part, and the March repair is the one that wasn’t in the plan.
    bars:
      - { label: Fuel, value: €962, percent: 100 }
      - { label: Insurance, value: €640, percent: 66 }
      - { label: March repair, value: €412, percent: 43, highlight: true }
      - { label: Parking & tolls, value: €170, percent: 18 }
    suggestions: [Compare with last year, Show the transactions]
  sort:
    heading: Every payment sorted for you
    body: Codes like “CARD PAYMENT FARMACIA SANTS BCN” become a name and a category you recognise. Monetyo learns from every fix you make.
    label: "Four bank transactions cleaned up and categorised automatically: a pharmacy under Health, a supermarket under Groceries, a train ticket under Transport, and a Bizum payment the user moved to Eating out, which Monetyo will remember."
    items:
      - {
          name: Farmacia Sants,
          raw: CARD PAYMENT FARMACIA SANTS BCN,
          category: health,
          categoryName: Health,
        }
      - {
          name: Lidl,
          raw: CARD PURCHASE LIDL 0412 BARCELONA,
          category: groceries,
          categoryName: Groceries,
        }
      - {
          name: Renfe,
          raw: RENFE TRAVEL ONLINE MADRID,
          category: transport,
          categoryName: Transport,
        }
      - name: Marta, dinner split
        raw: BIZUM FROM MARTA F. REF DINNER
        category: eatingOut
        categoryName: Eating out
        learned: You moved this from Transfers. Next time it’s automatic.
  receipts:
    heading: Take a photo of the receipt
    body: Monetyo reads the receipt, splits it across your categories and attaches it to the payment. It works with bank statements too.
    label: A supermarket receipt for 63.18 euros read by Monetyo and split into Groceries, Household and Health.
    receipt:
      store: LIDL
      address: C. de Sants 112
      lines:
