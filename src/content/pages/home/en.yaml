title: "Monetyo: the family budget with AI built in"
description: One budget for the whole family, with an assistant that sorts your spending, reads receipts and tells you where the money went. Your data stays in Europe.

hero:
  heading:
    - Where did the money go?
    - Ask Monetyo.
  lead: See everything your family spends in one budget, and how much is left this month. Monetyo sorts each payment into the right category and warns you early when a budget is about to run out.

