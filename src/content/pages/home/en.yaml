  budgets:
    heading: Transfers and refunds counted properly
    body: Moving money into savings isn’t spending, and a refund isn’t extra income. Monetyo keeps them apart, so your budget shows what you really spent.
    label: "Three transactions: a 400 euro transfer to savings that is left out of budgets, a 29.90 euro refund that goes back into the Clothes budget, and an 18.45 euro pharmacy expense counted under Health."
