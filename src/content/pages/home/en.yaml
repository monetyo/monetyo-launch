faq:
  heading: Glad you asked.
  items:
    - question: When can I use it?
      answer: >-
        We’re building as fast as we can, but we won’t ship until the
        experience, privacy and security are right. No shortcuts. People on the
        list will be the first to try it.
    - question: How much will it cost?
      answer: >-
        We’re weighing a few options: a subscription per family, a free plan
        with paid extras, a free trial, or an open source version you can host
        yourself next to a paid cloud version. People on the list will help us
        choose.
    - question: Will it work with my bank?
      answer: >-
        Yes. We’ll connect to banks across Europe through
        <a href="https://plaid.com/en-eu/" target="_blank" rel="noopener noreferrer">Plaid</a>,
        which is licensed under {psd2}, audited for {soc2} and certified to
        {iso27001}. Until your bank is supported, you can upload a file from any
        bank, scan receipts or type payments in by hand.
      terms:
        - id: psd2
          label: PSD2
          tip: The EU law that lets licensed companies read your bank data only with your permission, under a regulator’s supervision.
        - id: soc2
          label: SOC 2 Type 2
          tip: An independent audit that tests over several months that security controls really work as described.
        - id: iso27001
          label: ISO 27001
          tip: The international standard for managing information security, checked every year by independent auditors.
    - question: Can the whole family use it?
      answer: >-
        Yes, however your family is made up. You decide who has full control,
        who can add and edit, and who only sees certain parts, whether that’s a
        partner, a flatmate or a financial adviser. Each person can also arrange
        their own widgets, views and tables.
    - question: What happens to my data when I use the AI?
      answer: >-
        The AI assistant will see as little as possible. Names and account
        numbers are removed before anything leaves your account, small models
        run on our own servers in Europe, and on-device AI such as Apple
        Intelligence is used where your phone supports it. It’s optional, it
        can only read and sort your spending, never move money, and your data
        is never used to train models.
    - question: Will Monetyo be open source?
      answer: >-
        We’d love it to be, and we’re seriously considering it: we use open
        source every day, and it would mean you always control your data. We’re
        working out how to do it while keeping Monetyo sustainable, and we’d
        like to hear what you think.
    - question: What will you email me?
      answer: >-
        A message when there’s something to try, and a short survey when we
        have a decision to make. Your answers aren’t linked to your email
        unless you choose to leave it for a longer interview. Every email has a
        link to unsubscribe.

