privacy:
  heading: Your family’s money stays your family’s business.
  lead: What a family spends says a lot about it. We wrote down how we’d handle your data before writing any code, and every part of Monetyo follows those rules.
  items:
    - icon: globe
      heading: Made in Europe, kept in Europe
      body: Built in Barcelona and stored in Frankfurt, backups included. Nothing about your family leaves the EU.
    - icon: lock
      heading: No bank passwords, ever
      body: Your bank connects through a provider with {psd2}, {soc2} and {iso27001}. We never see your password.
      terms:
        - id: psd2
          label: PSD2
          tip: The EU law that lets licensed companies read your bank data only with your permission, under a regulator’s supervision.
        - id: iso27001
          label: ISO 27001
          tip: The international standard for managing information security, checked every year by independent auditors.
        - id: soc2
          label: SOC 2 Type 2
          tip: An independent audit that tests over several months that security controls really work as described.
    - icon: key
      heading: Locked for your family only
      body: Account numbers and bank connections are encrypted with a key that belongs to your family alone.
    - icon: trash
      heading: Delete means gone
      body: Close your account and we destroy your family’s key. No one can read your data again, backups included.
    - icon: download
      heading: Yours to take away
      body: Download everything we hold about you, whenever you like, in a format you can take anywhere.
    - icon: shield
      heading: AI-native, not vibe-coded
      body: AI helps us build faster. Decades in the industry shape the direction, the architecture and every decision.

