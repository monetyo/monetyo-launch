ai:
  eyebrow: Monetyo IA
  heading: Pregúntale por tu dinero como a una persona.
  lead: El asistente trabaja con tus propios movimientos, así que si le preguntas cuánto se fue en comer fuera el mes pasado, te da la cifra real.
  ask:
    heading: Pregunta a tu manera
    body: Sin filtros ni informes que configurar. Escribe la pregunta tal como la harías conversando y recibirás una cifra con los pagos que hay detrás.
    label: "Una conversación con el asistente. Pregunta: ¿qué nos ha costado el coche este año? Respuesta: 2184 euros hasta ahora, repartidos entre gasolina, seguro, una reparación en marzo, y parking y peajes."
    question: ¿Qué nos ha costado el coche este año?
    answer:
      lead: Lleváis 2184 €.
      rest: La gasolina es lo que más pesa, y la reparación de marzo es lo que no estaba previsto.
    bars:
      - { label: Gasolina, value: 962 €, percent: 100 }
      - { label: Seguro, value: 640 €, percent: 66 }
      - {
          label: Reparación de marzo,
          value: 412 €,
          percent: 43,
          highlight: true,
        }
      - { label: Parking y peajes, value: 170 €, percent: 18 }
    suggestions: [Frente al año pasado, Ver los movimientos]
  sort:
    heading: Cada pago, en su categoría
    body: Un código como «TPV*FARMACIA SANTS BCN ES» pasa a ser un nombre y una categoría que reconoces. Y Monetyo aprende de lo que corriges.
    label: "Cuatro movimientos bancarios limpiados y clasificados solos: una farmacia en Salud, un supermercado en Súper, un billete de tren en Transporte y un Bizum que el usuario pasó a Comer fuera, algo que Monetyo recordará."
    items:
      - {
          name: Farmacia Sants,
          raw: TPV*FARMACIA SANTS BCN ES,
          category: health,
          categoryName: Salud,
        }
      - {
          name: Lidl,
          raw: COMPRA TARJ. LIDL 0412 BARCELONA,
          category: groceries,
          categoryName: Súper,
        }
      - {
          name: Renfe,
          raw: RENFE VIAJEROS INTERNET MADRID,
          category: transport,
          categoryName: Transporte,
        }
      - name: Marta, cena a medias
