faq:
  heading: Buena pregunta.
  items:
    - question: ¿Cuándo podré usarlo?
      answer: >-
        Vamos tan rápido como podemos, pero no lo lanzaremos hasta que la
        experiencia, la privacidad y la seguridad estén a punto. Sin atajos.
        Quienes estén en la lista lo probarán antes que nadie.
    - question: ¿Cuánto va a costar?
      answer: >-
        Estamos valorando varias opciones: una suscripción por familia, un plan
        gratis con extras de pago, una prueba gratis o una versión de código
        abierto para alojar tú, junto a otra de pago en la nube. La gente de la
        lista nos ayudará a elegir.
    - question: ¿Funcionará con mi banco?
      answer: >-
        Sí. Nos conectaremos con bancos de toda Europa a través de
        <a href="https://plaid.com/en-eu/" target="_blank" rel="noopener noreferrer">Plaid</a>,
        que tiene licencia {psd2}, auditoría {soc2} y certificación
        {iso27001}. Mientras trabajamos para conectar con tu banco, puedes subir un archivo
        de cualquier banco, escanear tickets o apuntar los pagos a mano.
      terms:
        - id: psd2
          label: PSD2
          tip: La ley de la UE que deja a empresas con licencia leer tus datos bancarios solo con tu permiso, bajo supervisión de un regulador.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Una auditoría externa que comprueba durante meses que los controles de seguridad hacen de verdad lo que dicen.
        - id: iso27001
          label: ISO 27001
          tip: La norma internacional para gestionar la seguridad de la información, revisada cada año por auditores externos.
    - question: ¿Puede usarlo toda la familia?
      answer: >-
        Sí, sea como sea tu familia. Tú decides quién tiene el control total,
        quién puede añadir y editar y quién solo ve algunas partes, ya sea tu
        pareja, tu compañero de piso o un asesor financiero. Además, cada
        persona puede organizar sus propios widgets, vistas y tablas.
    - question: ¿Qué pasa con mis datos cuando uso la IA?
      answer: >-
        El asistente de IA verá lo mínimo posible. Quitamos los nombres y los
        números de cuenta antes de que nada salga de tu cuenta, ejecutamos
        modelos IA pequeños en nuestros propios servidores en Europa y, cuando tu
        móvil lo permite, usamos IA en el propio dispositivo, como Apple
        Intelligence. Es opcional, solo puede leer y ordenar tus gastos, nunca
        mover dinero, y tus datos nunca se usan para entrenar modelos IA.
    - question: ¿Será Monetyo de código abierto?
      answer: >-
        Nos encantaría y lo estamos valorando en serio: usamos código abierto a
        diario y significaría que siempre controlas tus datos. Estamos viendo
        cómo hacerlo sin que Monetyo deje de ser sostenible y nos gustaría
        saber qué opinas.
    - question: ¿Qué me vais a enviar?
      answer: >-
        Un mensaje cuando haya algo que probar y una encuesta breve cuando
        tengamos que tomar una decisión. Tus respuestas no se vinculan a tu
        correo, salvo que decidas dejarlo para una entrevista más larga. Todos
        los correos llevan un enlace para darte de baja.

join:
  heading: Accede antes y ayuda a dar forma a Monetyo
  lead: Te escribiremos cuando haya algo que probar y, de vez en cuando, con una encuesta breve.
