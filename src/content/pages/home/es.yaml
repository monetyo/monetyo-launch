privacy:
  heading: El dinero de tu familia es cosa de tu familia.
  lead: Lo que gasta una familia dice mucho de ella. Antes de programar nada, dejamos por escrito cómo trataríamos tus datos, y cada parte de Monetyo sigue esas reglas.
  items:
    - icon: globe
      heading: Creado y guardado en Europa
      body: Lo hacemos en Barcelona y lo guardamos en Fráncfort, copias incluidas. Nada de tu familia sale de la UE.
    - icon: lock
      heading: Sin contraseñas del banco
      body: Tu banco se conecta mediante un proveedor con {psd2}, {soc2} e {iso27001}. Nunca vemos tu contraseña.
      terms:
        - id: psd2
          label: PSD2
          tip: La ley de la UE que deja a empresas con licencia leer tus datos bancarios solo con tu permiso, bajo supervisión de un regulador.
        - id: iso27001
          label: ISO 27001
          tip: La norma internacional para gestionar la seguridad de la información, revisada cada año por auditores externos.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Una auditoría externa que comprueba durante meses que los controles de seguridad hacen de verdad lo que dicen.
    - icon: key
      heading: Con la llave de tu familia
      body: Los números de cuenta y las conexiones bancarias se cifran con una clave que solo tiene tu familia.
    - icon: trash
      heading: Borrar es borrar
      body: Si cierras la cuenta, destruimos la clave de tu familia. Nadie podrá volver a leer tus datos, copias incluidas.
    - icon: download
      heading: Tus datos, contigo
      body: Descarga cuando quieras todo lo que sabemos de ti, en un formato que puedes llevarte donde quieras.
    - icon: shield
      heading: IA, sí. A ciegas, no.
      body: La IA nos ayuda a construir más rápido. Nuestra experiencia en el sector marca el rumbo, la arquitectura y cada decisión.

