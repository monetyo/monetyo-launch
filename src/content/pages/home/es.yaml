  steps:
    - title: Déjanos tu correo y confírmalo.
      body: Así sabemos que quieres que te preguntemos.
    - title: Responde unas preguntas cortas.
      body: Solo si hay una decisión real en juego. Sáltate las que quieras.
    - title: Mira qué resulta de tus respuestas.
      body: Compartimos qué respondió la gente y qué hacemos gracias a ello.
  ideas:
    heading: Solo algunas de las ideas de la lista
    all: Todas
    filterLabel: Ordenar ideas por tema
    groups:
