title: "Monetyo: presupuesto familiar con IA integrada"
description: Un presupuesto para toda la familia, con un asistente que ordena tus gastos, lee tickets y te dice en qué se fue el dinero. Tus datos se quedan en Europa.

hero:
  heading:
    - ¿Adónde se fue el dinero?
    - Preguntaselo a Monetyo.
  lead: Controla en un solo presupuesto todo lo que gasta tu familia y cuánto queda para este mes. Monetyo guarda cada pago en su categoría y te avisa con tiempo cuando un presupuesto está a punto de agotarse.

