title: "Monetyo: il budget di famiglia con l’IA integrata"
description: Un budget per tutta la famiglia, con un assistente che ordina le spese, legge gli scontrini e ti dice dove sono finiti i soldi. I dati restano in Europa.

hero:
  heading:
    - Dove sono finiti i soldi?
    - Chiedi a Monetyo.
  lead: Tutte le spese della famiglia in un solo budget, e quanto resta per questo mese. Monetyo mette ogni pagamento nella categoria giusta e ti avvisa per tempo quando un budget sta per finire.

