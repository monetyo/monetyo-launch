faq:
  heading: Bella domanda.
  items:
    - question: Quando potrò usarlo?
      answer: >-
        Andiamo più veloci che possiamo, ma non lo lanceremo finché esperienza,
        privacy e sicurezza non saranno a posto. Niente scorciatoie. Chi è in
        lista lo proverà per primo.
    - question: Quanto verrà a costare?
      answer: >-
        Stiamo valutando alcune strade: un abbonamento per famiglia, un piano gratuito con extra a pagamento, una prova gratuita, oppure una versione open source da installare in autonomia, accanto a una versione cloud a pagamento. Chi è in lista ci aiuterà a scegliere.
    - question: Funzionerà con la mia banca?
      answer: >-
        Sì. Ci collegheremo alle banche di tutta Europa tramite
        <a href="https://plaid.com/en-eu/" target="_blank" rel="noopener noreferrer">Plaid</a>,
        autorizzato {psd2}, verificato {soc2} e certificato {iso27001}. Finché
        la tua banca non è supportata, puoi caricare un file di qualsiasi
        banca, fotografare gli scontrini o inserire i pagamenti a mano.
      terms:
        - id: psd2
          label: PSD2
          tip: La norma UE per cui le aziende autorizzate leggono i tuoi dati bancari solo con il tuo consenso, vigilate da un’autorità.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Un audit indipendente che per mesi verifica che i controlli di sicurezza funzionino davvero come descritto.
        - id: iso27001
          label: ISO 27001
          tip: Lo standard internazionale per gestire la sicurezza dei dati, verificato ogni anno da revisori indipendenti.
    - question: Può usarlo tutta la famiglia?
      answer: >-
        Sì, comunque sia fatta la tua famiglia. Decidi tu chi ha il controllo
        totale, chi può aggiungere e modificare e chi vede solo alcune parti,
        che sia il partner, un coinquilino o un consulente finanziario. Ognuno
        può anche organizzare i propri widget, viste e tabelle.
    - question: Che fine fanno i miei dati quando uso l’IA?
      answer: >-
        L’assistente IA vedrà il meno possibile. Nomi e numeri di conto vengono
        rimossi prima che qualcosa esca dal tuo account, i modelli piccoli
        girano sui nostri server in Europa e, dove il telefono lo supporta, si
        usa l’IA sul dispositivo, come Apple Intelligence. È facoltativo, può
        solo leggere e ordinare le tue spese, mai spostare denaro, e i tuoi
        dati non vengono mai usati per addestrare modelli.
    - question: Monetyo sarà open source?
      answer: >-
        Ci piacerebbe, e ci stiamo pensando seriamente: usiamo l’open source
        ogni giorno, e vorrebbe dire che i tuoi dati restano sempre sotto il tuo
        controllo. Stiamo capendo come farlo mantenendo Monetyo sostenibile, e
        vorremmo sentire cosa ne pensi.
    - question: Che email mi manderete?
      answer: >-
        Un messaggio quando ci sarà qualcosa da provare e un breve sondaggio
        quando dovremo decidere. Le risposte non sono collegate alla
        tua email, a meno che tu non scelga di lasciarla per un’intervista più
        lunga. In ogni email trovi un link per disiscriverti.

