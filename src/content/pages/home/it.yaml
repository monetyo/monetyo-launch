privacy:
  heading: I soldi di famiglia sono affari di famiglia.
  lead: Le spese dicono molto di una famiglia. Per questo, prima ancora di scrivere codice, abbiamo deciso come trattare i tuoi dati. Ogni parte di Monetyo segue quelle regole.
  items:
    - icon: globe
      heading: Sviluppato e ospitato in Europa
      body: Lo sviluppiamo a Barcellona e lo ospitiamo a Francoforte, backup compresi. I dati della tua famiglia non escono mai dall’UE.
    - icon: lock
      heading: Nessuna password bancaria
      body: Il conto si collega tramite un fornitore autorizzato {psd2}, con {soc2} e {iso27001}. La tua password non passa mai da noi.
      terms:
        - id: psd2
          label: PSD2
          tip: La direttiva europea che permette alle aziende autorizzate di accedere ai tuoi dati bancari solo con il tuo consenso e sotto controllo pubblico.
        - id: iso27001
          label: ISO 27001
          tip: Lo standard internazionale sulla sicurezza delle informazioni, verificato ogni anno da revisori indipendenti.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Una verifica indipendente che per diversi mesi controlla che le misure di sicurezza funzionino davvero.
    - icon: key
      heading: Una chiave solo per voi
      body: Numeri di conto e collegamenti bancari sono cifrati con una chiave che appartiene solo alla tua famiglia.
    - icon: trash
      heading: Se cancelli, è per sempre
      body: Quando chiudi l’account distruggiamo la chiave della tua famiglia. Nessuno potrà più leggere i tuoi dati, nemmeno dai backup.
    - icon: download
      heading: Esporti tutto quando vuoi
      body: Puoi scaricare in qualsiasi momento tutti i dati che abbiamo su di te, in un formato che puoi usare ovunque.
    - icon: shield
      heading: L’IA aiuta, l’esperienza decide
      body: L’IA ci aiuta a sviluppare più in fretta. Direzione, architettura e decisioni vengono da decenni di esperienza nel settore.

