title: "Monetyo: il budget di famiglia con l’assistente IA"
description: Le spese di famiglia in un unico budget e un assistente che le classifica, legge gli scontrini e ti dice dove finiscono i soldi. I dati restano in Europa.

hero:
  heading:
    - Dove sono finiti i soldi?
    - Chiedilo a Monetyo.
  lead: Vedi tutte le spese della famiglia in un unico budget e sai sempre quanto ti resta fino a fine mese. Monetyo mette ogni spesa nella categoria giusta e ti avvisa per tempo se stai per sforare il budget.

