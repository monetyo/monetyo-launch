privacy:
  heading: I soldi di famiglia restano affari di famiglia.
  lead: Le spese di una famiglia dicono molto di lei. Prima di scrivere codice abbiamo fissato per iscritto come trattare i tuoi dati, e tutto Monetyo segue quelle regole.
  items:
    - icon: globe
      heading: Creato e custodito in Europa
      body: Sviluppato a Barcellona e ospitato a Francoforte, backup compresi. Niente della tua famiglia esce dall’UE.
    - icon: lock
      heading: Password bancarie? Mai.
      body: La tua banca si collega tramite un fornitore con {psd2}, {soc2} e {iso27001}. Non vediamo mai la tua password.
      terms:
        - id: psd2
          label: PSD2
          tip: La norma UE per cui le aziende autorizzate leggono i tuoi dati bancari solo con il tuo consenso, vigilate da un’autorità.
        - id: iso27001
          label: ISO 27001
          tip: Lo standard internazionale per gestire la sicurezza dei dati, verificato ogni anno da revisori indipendenti.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Un audit indipendente che per mesi verifica che i controlli di sicurezza funzionino davvero come descritto.
    - icon: key
      heading: Sotto chiave, solo per voi
      body: Numeri di conto e collegamenti bancari sono cifrati con una chiave che appartiene solo alla tua famiglia.
    - icon: trash
      heading: Cancellati davvero
      body: Chiudi l’account e distruggiamo la chiave di famiglia. Nessuno potrà più leggere i tuoi dati, backup compresi.
    - icon: download
      heading: Portali dove vuoi
      body: Scarica tutto quello che abbiamo su di te, quando vuoi, in un formato che puoi usare ovunque.
    - icon: shield
      heading: IA nativa, non improvvisata
      body: L’IA ci aiuta a costruire più in fretta. Decenni nel settore guidano la direzione, l’architettura e ogni scelta.

