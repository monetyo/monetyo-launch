faq:
  heading: Domande frequenti
  items:
    - question: Quando potrò usarlo?
      answer: >-
        Ci stiamo lavorando a tutta velocità, ma lo lanceremo solo quando
        esperienza, privacy e sicurezza saranno all’altezza. Niente scorciatoie.
        Chi è in lista lo proverà per primo.
    - question: Quanto costerà?
      answer: >-
        Stiamo valutando diverse opzioni: un abbonamento per famiglia, un piano
        gratuito con funzioni a pagamento, un periodo di prova, oppure una
        versione open source da installare sul tuo server insieme a una versione
        cloud a pagamento. Sceglieremo insieme a chi è in lista.
    - question: Funzionerà con la mia banca?
      answer: >-
        Sì. Ci collegheremo alle banche di tutta Europa tramite
        <a href="https://plaid.com/en-eu/" target="_blank" rel="noopener noreferrer">Plaid</a>,
        società autorizzata ai sensi della {psd2}, con audit {soc2} e
        certificazione {iso27001}. Se la tua banca non è ancora supportata, puoi
        caricare un estratto conto di qualsiasi banca, fotografare gli scontrini
        o inserire le spese a mano.
      terms:
        - id: psd2
          label: PSD2
          tip: La direttiva europea che permette alle aziende autorizzate di accedere ai tuoi dati bancari solo con il tuo consenso e sotto controllo pubblico.
        - id: soc2
          label: SOC 2 Tipo 2
          tip: Una verifica indipendente che per diversi mesi controlla che le misure di sicurezza funzionino davvero.
        - id: iso27001
          label: ISO 27001
          tip: Lo standard internazionale sulla sicurezza delle informazioni, verificato ogni anno da revisori indipendenti.
    - question: Può usarlo tutta la famiglia?
      answer: >-
        Sì, qualunque sia la tua famiglia. Decidi tu chi ha il controllo
        completo, chi può aggiungere e modificare e chi vede solo alcune
        sezioni, che sia il partner, un coinquilino o il consulente finanziario.
        Poi ognuno organizza widget, viste e tabelle come preferisce.
    - question: Che fine fanno i miei dati quando uso l’IA?
      answer: >-
        L’assistente vedrà il meno possibile. Nomi e numeri di conto vengono
        tolti prima che i dati escano dal tuo account, i modelli più piccoli
        girano sui nostri server in Europa e, se il telefono lo permette, usiamo
        l’IA direttamente sul dispositivo, come Apple Intelligence. L’assistente
        è facoltativo e può solo leggere e classificare le spese, mai spostare
        denaro. I tuoi dati non vengono mai usati per addestrare modelli.
    - question: Monetyo sarà open source?
      answer: >-
        Ci piacerebbe, e ci stiamo pensando seriamente. Usiamo software open source ogni giorno, e un Monetyo open source ti lascerebbe sempre il pieno controllo dei tuoi dati. Stiamo cercando il modo di farlo senza compromettere il
        futuro di Monetyo, e vorremmo sapere cosa ne pensi.
    - question: Cosa riceverò via email?
      answer: >-
        Ti scriveremo quando ci sarà qualcosa da provare e ti manderemo un breve
        sondaggio quando dovremo prendere una decisione. Le risposte non sono
        collegate alla tua email, a meno che tu non decida di lasciarla per
        un’intervista. In ogni email trovi il link per annullare l’iscrizione.

join:
  heading: Provalo in anteprima e aiutaci a costruire Monetyo
  lead: Ti scriveremo quando ci sarà qualcosa da provare e, ogni tanto, per un breve sondaggio.
