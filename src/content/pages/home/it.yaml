  lead: Riunisci in un unico posto chi condivide i soldi di casa, così guardate tutti gli stessi numeri.
  together:
    heading: L’accesso giusto per ogni persona
    body: Dai il controllo totale a qualcuno, lascia che altri aggiungano e modifichino, o condividi solo ciò che serve, come i report con un consulente finanziario. Ognuno può anche impostare i propri widget, viste e tabelle.
    label: "Membri della famiglia: Marta ha il controllo totale, Jonas può aggiungere e modificare, e Clara, consulente finanziaria, vede solo i report."
    title: Membri
    invite: Invita
    members:
      - {
          initial: M,
          tint: blue,
          name: Marta Ferrer,
          description: "Controllo totale, anche la fatturazione",
          role: Titolare,
          owner: true,
        }
      - {
          initial: J,
          tint: peach,
          name: Jonas Lindqvist,
          description: Aggiunge e modifica tutto,
          role: Editor,
