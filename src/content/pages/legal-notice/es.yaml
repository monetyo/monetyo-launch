title: Aviso legal
description: Quién gestiona la web de Monetyo, para qué sirve y qué condiciones se aplican a su uso.
updated: 2026-11-22
updatedLabel: Actualizado el {date}
intro: >-
  Este aviso legal se aplica solo a la web monetyo.com y se publica en cumplimiento del artículo 10 de la <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">Ley 34/2002, de 11 de julio, de servicios de la sociedad de la información y de comercio electrónico (LSSI-CE)</a>. La app de Monetyo tendrá sus propios términos y condiciones cuando se lance.

