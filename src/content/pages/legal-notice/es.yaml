  - heading: Para qué sirve esta web
    body: >-
      Esta web presenta Monetyo, una app de presupuesto familiar que aún está
      en desarrollo, y gestiona su lista de espera. No vende nada, no acepta
      pagos ni hace falta crear una cuenta.

  - heading: Propiedad intelectual
    body: >-
      Los textos, las ilustraciones, el diseño y el código de esta web son de
      su titular, salvo que se indique lo contrario. Puedes enlazarla y citar
      fragmentos breves indicando la fuente; cualquier otro uso necesita
      permiso por escrito. Los nombres y logotipos de otras empresas son
      suyos y solo se usan para referirse a sus servicios.

  - heading: Enlaces a otras páginas
    body: >-
      Esta web enlaza a servicios y páginas de terceros. No los controlamos y
      no respondemos de sus contenidos ni de cómo tratan tus datos.

  - heading: Responsabilidad del contenido
    body: >-
      Intentamos que todo lo que contamos aquí sea exacto, pero Monetyo sigue
      en desarrollo, así que las funciones, los planes y las fechas que
      describimos pueden cambiar. Nada de esto limita la responsabilidad que
      la ley no permite limitar.

  - heading: Alojamiento
    body: >-
      La web está alojada en
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel Inc.</a>,
      con sede en Estados Unidos. Consulta la
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">política de privacidad de Vercel</a>
      y <a href="/privacy/">la nuestra</a> para saber cómo se tratan tus datos.

  - heading: Ley aplicable y jurisdicción
    body: >-
      Esta web y este aviso se rigen por la ley española. Cuando la ley lo
      permita y ambas partes lo acuerden válidamente, los conflictos se
      resolverán en los juzgados de Barcelona (España). Si no, la jurisdicción
      será la que fijen las normas aplicables, incluidas las que protegen a los
      consumidores.
