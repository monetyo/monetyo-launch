title: Note legali
description: Chi gestisce il sito di Monetyo, a cosa serve e le condizioni che si applicano al suo utilizzo.
updated: 2026-11-22
updatedLabel: "Ultimo aggiornamento: {date}"
intro: >-
  Queste note legali si applicano solo al sito monetyo.com e sono pubblicate ai sensi dell’articolo 10 della <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">Legge spagnola 34/2002 sui servizi della società dell’informazione e sul commercio elettronico (LSSI-CE)</a>. L’app Monetyo avrà termini e condizioni propri al momento del lancio.

