  - heading: Finalità del sito
    body: >-
      Questo sito presenta Monetyo, un’app per gestire il budget familiare
      ancora in fase di sviluppo, e ne gestisce la lista d’attesa. Non vende
      prodotti, non accetta pagamenti e non richiede la creazione di un
      account.

  - heading: Proprietà intellettuale
    body: >-
      Salvo diversa indicazione, testi, illustrazioni, grafica e codice di
      questo sito appartengono al titolare. Puoi inserire link al sito e
      citarne brevi estratti indicandone la fonte; qualsiasi altro utilizzo
      richiede un’autorizzazione scritta. I nomi e i marchi di altre aziende
      appartengono ai rispettivi titolari e sono citati solo per indicarne i
      servizi.

  - heading: Link a siti esterni
    body: >-
      Questo sito contiene link a servizi e pagine gestiti da terzi. Non li
      controlliamo e non siamo responsabili dei loro contenuti né del modo in
      cui trattano i tuoi dati.

  - heading: Responsabilità sui contenuti
    body: >-
      Facciamo il possibile perché le informazioni pubblicate siano corrette,
      ma Monetyo è ancora in fase di sviluppo: funzionalità, piani e date
      descritti su questo sito possono cambiare. Nulla di quanto riportato qui
      limita le responsabilità che la legge non consente di limitare.

  - heading: Hosting
    body: >-
      Il sito è ospitato da
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel
      Inc.</a>, società con sede negli Stati Uniti. Per sapere come vengono
      trattati i tuoi dati, consulta
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">l’informativa
      sulla privacy di Vercel</a> e la nostra <a href="/privacy/">informativa sulla
      privacy</a>.

  - heading: Legge applicabile e foro competente
    body: >-
      Questo sito e queste note legali sono regolati dalla legge spagnola. Se
      la legge lo consente ed entrambe le parti lo accettano validamente, le
      eventuali controversie sono di competenza dei tribunali di Barcellona, in
      Spagna. In caso contrario, il foro competente è stabilito dalle norme
      applicabili, comprese quelle a tutela dei consumatori.
